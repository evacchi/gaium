[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gaium"
version = "0.1.0"
description = "GNOME AI Usage Monitor aggregator for local AI agent logs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GAIUM contributors" }]
dependencies = []

[dependency-groups]
dev = []

[project.scripts]
gaium = "gaium.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["gaium*"]
